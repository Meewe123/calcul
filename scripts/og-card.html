<!doctype html>
<!-- Template for public/og.png (1200×630). Rendered by scripts/render-images.ts. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/tape.css" />
    <style>
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 400;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-cyrillic-400-normal.woff2');
        unicode-range: U+0400-045F;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 400;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2');
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 72px;
        padding: 0 80px;
        box-sizing: border-box;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
      }
      .intro {
        align-self: center;
        display: grid;
        gap: 28px;
      }
      .wordmark {
        font-family: var(--font-mono);
        font-size: 96px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .tagline {
        font-size: 30px;
        line-height: 1.3;
      }
      .tagline span {
        display: block;
        color: var(--ink-muted);
      }
      .tape__paper {
        margin: 72px 0 0;
        align-self: stretch;
      }
      .tape__scroll {
        padding: 48px 28px 0;
        overflow: hidden;
      }
      .tape__list {
        gap: 18px;
        margin-top: 0;
      }
      .entry {
        padding: 0;
      }
      .entry__expression {
        font-size: 22px;
      }
      .entry__result {
        font-size: 36px;
      }
      .entry__number {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <div class="wordmark">calcul</div>
      <p class="tagline">
        калькулятор с лентой
        <span>a calculator with a paper tape</span>
      </p>
    </div>
    <div class="tape__paper">
      <div class="tape__scroll">
        <ol class="tape__list">
          <li>
            <div class="entry">
              <span class="entry__number">001</span
              ><span class="entry__expression">0,1&thinsp;+&thinsp;0,2</span
              ><span class="entry__result"><span class="entry__sign">=</span>0,3</span>
            </div>
          </li>
          <li>
            <div class="entry">
              <span class="entry__number">002</span
              ><span class="entry__expression">1&#8239;200&thinsp;−&thinsp;15%</span
              ><span class="entry__result"><span class="entry__sign">=</span>1&#8239;020</span>
            </div>
          </li>
          <li>
            <div class="entry">
              <span class="entry__number">003</span
              ><span class="entry__expression">1&thinsp;÷&thinsp;3</span
              ><span class="entry__result"><span class="entry__sign">≈</span>0,3333333333</span>
            </div>
          </li>
          <li>
            <div class="entry">
              <span class="entry__number">004</span
              ><span class="entry__expression">(2&thinsp;+&thinsp;3)&thinsp;×&thinsp;4</span
              ><span class="entry__result"><span class="entry__sign">=</span>20</span>
            </div>
          </li>
        </ol>
      </div>
    </div>
  </body>
</html>
